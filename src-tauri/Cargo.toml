[package]
name = "local-agent-desktop"
version = "0.1.0"
description = "Aplicativo desktop para controlar os serviços locais do Local Agent."
authors = ["Reinaldo Domingos"]
edition = "2021"
rust-version = "1.77 "

[lib]
name = "local_agent_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
thiserror = "1"
